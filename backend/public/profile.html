<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Employee Profile – WE GUIDE</title>
  <meta name="description" content="WE GUIDE Employee Public Profile" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --card:      #21262d;
      --accent:    #6e40c9;
      --accent2:   #a855f7;
      --emerald:   #10b981;
      --red:       #ef4444;
      --text:      #f0f6fc;
      --muted:     #8b949e;
      --border:    #30363d;
      --radius:    16px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 0 40px;
    }

    /* Header */
    .header {
      width: 100%;
      background: linear-gradient(135deg, var(--accent) 0%, #9333ea 100%);
      padding: 32px 20px 60px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Ccircle cx='30' cy='30' r='20'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .header .logo {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: .7;
      position: relative;
    }
    .header h1 {
      font-size: 26px;
      font-weight: 800;
      margin-top: 8px;
      position: relative;
    }
    .header .subtitle {
      font-size: 13px;
      opacity: .75;
      margin-top: 4px;
      position: relative;
    }

    /* Avatar circle */
    .avatar-wrap {
      display: flex;
      justify-content: center;
      margin-top: -36px;
    }
    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: 4px solid var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 8px 24px rgba(110,64,201,.4);
    }

    /* Card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin: 16px 16px 0;
      padding: 20px;
      max-width: 440px;
      width: calc(100% - 32px);
    }
    .card-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      align-items: flex-start;
    }
    .row .icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(110,64,201,.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .row .content .label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
    }
    .row .content .value {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-top: 2px;
    }

    /* Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(110,64,201,.2);
      color: var(--accent2);
      border: 1px solid rgba(110,64,201,.3);
      margin-top: 4px;
    }

    /* SOS Button */
    .sos-card {
      background: linear-gradient(135deg, rgba(239,68,68,.15), rgba(239,68,68,.05));
      border-color: rgba(239,68,68,.3);
    }
    .sos-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 16px 24px;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 700;
      width: 100%;
      cursor: pointer;
      text-decoration: none;
      transition: all .2s;
      box-shadow: 0 4px 20px rgba(239,68,68,.4);
      animation: pulse 2s infinite;
    }
    .sos-btn:hover { transform: scale(1.02); box-shadow: 0 6px 28px rgba(239,68,68,.6); }
    .sos-btn:active { transform: scale(.98); }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 4px 20px rgba(239,68,68,.4); }
      50%       { box-shadow: 0 4px 30px rgba(239,68,68,.7); }
    }

    .sos-hint {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 10px;
    }

    /* Footer */
    .footer {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 24px;
    }
    .footer strong { color: var(--accent2); }

    /* Loading / Error states */
    .state {
      text-align: center;
      padding: 60px 20px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent2);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .slide-in {
      animation: slideIn .5s cubic-bezier(.22, 1, .36, 1) forwards;
      opacity: 0;
    }
    @keyframes slideIn {
      from { transform: translateY(20px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="state">
      <div class="spinner"></div>
      <p style="color:var(--muted)">Loading profile…</p>
    </div>
  </div>

  <script>
    const token = location.pathname.split('/').pop();

    async function loadProfile() {
      try {
        const res = await fetch(`/api/public/profile/${token}`);
        const json = await res.json();
        if (!res.ok || !json.success) throw new Error(json.message || 'Not found');
        render(json.data);
      } catch (e) {
        renderError(e.message);
      }
    }

    function initials(name) {
      return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
    }

    function formatDOB(dob) {
      if (!dob) return '—';
      const d = new Date(dob);
      return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'long', year: 'numeric' });
    }

    function row(icon, label, value) {
      return `
        <div class="row slide-in">
          <div class="icon">${icon}</div>
          <div class="content">
            <div class="label">${label}</div>
            <div class="value">${value || '—'}</div>
          </div>
        </div>`;
    }

    function render(p) {
      document.title = `${p.name} – WE GUIDE`;
      document.getElementById('app').innerHTML = `
        <div class="header">
          <div class="logo">WE GUIDE</div>
          <h1>${p.name}</h1>
          <div class="subtitle">${p.designation} &bull; ${p.department}</div>
        </div>

        <div class="avatar-wrap">
          <div class="avatar">${initials(p.name)}</div>
        </div>

        <div class="card slide-in" style="margin-top:20px">
          <div class="card-title">👤 Personal Information</div>
          ${row('🗓️', 'Date of Birth', formatDOB(p.dob))}
          ${row('⚧', 'Gender', p.gender)}
          <div class="row slide-in">
            <div class="icon">🏢</div>
            <div class="content">
              <div class="label">Department</div>
              <div class="badge">🏷️ ${p.department}</div>
            </div>
          </div>
        </div>

        <div class="card slide-in">
          <div class="card-title">📞 Contact</div>
          ${row('📱', 'Phone Number', `<a href="tel:${p.phone}" style="color:var(--accent2);text-decoration:none">${p.phone}</a>`)}
        </div>

        <div class="card sos-card slide-in">
          <div class="card-title">🆘 Emergency Contact</div>
          ${row('🚨', 'Emergency Number', p.emergency_contact)}
          <a href="tel:${p.emergency_contact}" class="sos-btn" id="sosBtn">
            🆘 &nbsp;SOS — CALL NOW
          </a>
          <p class="sos-hint">Tap to immediately call the emergency contact</p>
        </div>

        <div class="footer">
          Powered by <strong>WE GUIDE</strong> &bull; Employee Management System
        </div>
      `;
    }

    function renderError(msg) {
      document.getElementById('app').innerHTML = `
        <div class="state">
          <div style="font-size:48px">❌</div>
          <h2 style="margin-top:16px">Profile Not Found</h2>
          <p style="color:var(--muted);margin-top:8px">${msg}</p>
        </div>`;
    }

    loadProfile();
  </script>
</body>
</html>
